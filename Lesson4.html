<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Strategies for Scaling & Growth</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Outfit:wght@300;400;500;600&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --cream: #F5F0E8;
  --cream2: #EDE7D9;
  --cream3: #E4DCCC;
  --forest: #1C3A2B;
  --forest2: #254D39;
  --forest3: #2F6347;
  --orange: #D4541A;
  --orange2: #E8763E;
  --gold: #C4952A;
  --gold2: #DDB84A;
  --ink: #1A1A14;
  --ink2: #2D2D22;
  --muted: #7A7060;
  --muted2: #9E9280;
  --rule: rgba(26,26,20,0.12);
  --rule2: rgba(26,26,20,0.07);
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 100%; height: 100%; overflow: hidden;
  background: var(--cream);
  color: var(--ink);
  font-family: 'Outfit', sans-serif;
  font-weight: 400;
}

/* ─── NOISE TEXTURE OVERLAY ─── */
body::before {
  content: '';
  position: fixed; inset: 0; z-index: 1000;
  pointer-events: none;
  opacity: 0.028;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size: 180px;
}

/* ─── DECORATIVE BACKGROUND SHAPES ─── */
.bg-shape {
  position: fixed; pointer-events: none; z-index: 0;
  transition: all 1.4s cubic-bezier(0.4,0,0.2,1);
}
.bg-circle-1 {
  width: 520px; height: 520px; border-radius: 50%;
  background: radial-gradient(circle, rgba(196,149,42,0.12) 0%, transparent 70%);
  top: -180px; right: -100px;
}
.bg-circle-2 {
  width: 400px; height: 400px; border-radius: 50%;
  background: radial-gradient(circle, rgba(28,58,43,0.08) 0%, transparent 70%);
  bottom: -120px; left: -80px;
}
.bg-stripe {
  width: 3px; height: 100vh;
  background: linear-gradient(to bottom, transparent, var(--rule), transparent);
  top: 0;
}
.bg-stripe-1 { left: 33.33%; }
.bg-stripe-2 { left: 66.66%; }

/* ─── APP SHELL ─── */
#app {
  position: relative; z-index: 1;
  width: 100vw; height: 100vh;
  display: grid;
  grid-template-rows: auto 3px 1fr auto;
}

/* ─── HEADER ─── */
.header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 40px;
  background: var(--cream);
  border-bottom: 1px solid var(--rule);
}
.header-brand {
  font-family: 'Courier Prime', monospace;
  font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--muted);
  display: flex; align-items: center; gap: 10px;
}
.header-brand::before {
  content: '▲'; font-size: 8px; color: var(--orange);
}
.header-nav {
  display: flex; gap: 4px; align-items: center;
}
.hnav-btn {
  padding: 5px 14px; border-radius: 20px;
  font-size: 10px; letter-spacing: 0.08em; font-weight: 500;
  border: 1px solid transparent;
  background: transparent; color: var(--muted);
  cursor: pointer; font-family: 'Outfit', sans-serif;
  transition: all 0.2s;
}
.hnav-btn:hover { color: var(--ink); border-color: var(--rule); }
.hnav-btn.active {
  background: var(--ink); color: var(--cream);
  border-color: var(--ink);
}
.header-counter {
  font-family: 'Courier Prime', monospace;
  font-size: 11px; color: var(--muted);
  letter-spacing: 0.05em;
}

/* ─── PROGRESS ─── */
.progress-track {
  background: var(--cream3); position: relative; overflow: hidden;
}
.progress-bar {
  height: 100%; position: absolute; left: 0; top: 0;
  background: linear-gradient(90deg, var(--forest), var(--orange));
  transition: width 0.6s cubic-bezier(0.4,0,0.2,1);
}

/* ─── SLIDE AREA ─── */
.slide-area {
  position: relative; overflow: hidden;
}

.slide {
  position: absolute; inset: 0;
  display: flex;
  opacity: 0; pointer-events: none;
  transform: translateX(48px);
  transition: opacity 0.45s ease, transform 0.45s cubic-bezier(0.4,0,0.2,1);
}
.slide.active {
  opacity: 1; pointer-events: all; transform: translateX(0);
}
.slide.exit-left {
  opacity: 0; transform: translateX(-48px);
}

/* ─── SLIDE LAYOUTS ─── */

/* TITLE SLIDE */
.s-title {
  flex-direction: column;
  padding: 0;
  position: relative;
}
.title-left {
  width: 52%;
  padding: 56px 56px 40px 56px;
  display: flex; flex-direction: column; justify-content: center;
  border-right: 1px solid var(--rule);
  position: relative;
}
.title-right {
  flex: 1;
  display: grid; grid-template-rows: 1fr 1fr;
  grid-template-columns: 1fr 1fr;
}

.s-title { flex-direction: row; }

.eyebrow {
  font-family: 'Courier Prime', monospace;
  font-size: 10px; letter-spacing: 0.3em; text-transform: uppercase;
  color: var(--orange); margin-bottom: 20px;
  display: flex; align-items: center; gap: 10px;
}
.eyebrow::before { content: ''; display: block; width: 28px; height: 1px; background: var(--orange); }

.display-title {
  font-family: 'Playfair Display', serif;
  font-size: clamp(38px, 4.5vw, 72px);
  font-weight: 900;
  line-height: 1.0;
  color: var(--ink);
  margin-bottom: 24px;
  letter-spacing: -0.02em;
}
.display-title em { font-style: italic; color: var(--forest); }
.display-title .hl { color: var(--orange); font-style: italic; }

.title-desc {
  font-size: 14px; line-height: 1.75; color: var(--muted);
  max-width: 380px; margin-bottom: 36px;
}

.topic-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
}
.topic-card {
  padding: 14px 16px;
  border: 1px solid var(--rule);
  background: var(--cream2);
  border-radius: 4px;
  cursor: pointer; transition: all 0.2s;
  position: relative; overflow: hidden;
}
.topic-card::before {
  content: ''; position: absolute; left: 0; top: 0; bottom: 0;
  width: 3px; transition: width 0.2s;
}
.topic-card:hover { background: var(--cream3); transform: translateY(-1px); }
.topic-card:hover::before { width: 4px; }
.tc1::before { background: var(--forest); }
.tc2::before { background: var(--orange); }
.tc3::before { background: var(--gold); }
.tc4::before { background: var(--ink); }
.topic-card-num {
  font-family: 'Courier Prime', monospace;
  font-size: 9px; color: var(--muted); letter-spacing: 0.2em;
  margin-bottom: 4px;
}
.topic-card-title { font-size: 12px; font-weight: 600; color: var(--ink); line-height: 1.3; }

/* QUADRANT PANELS in title */
.quad-panel {
  border-right: 1px solid var(--rule);
  border-bottom: 1px solid var(--rule);
  padding: 32px 28px;
  display: flex; flex-direction: column; justify-content: flex-end;
  position: relative; overflow: hidden;
}
.quad-panel:nth-child(2) { border-right: none; }
.quad-panel:nth-child(3) { border-right: 1px solid var(--rule); border-bottom: none; }
.quad-panel:nth-child(4) { border-right: none; border-bottom: none; }
.quad-bg-num {
  position: absolute; top: -10px; right: 12px;
  font-family: 'Playfair Display', serif;
  font-size: 100px; font-weight: 900;
  line-height: 1; opacity: 0.05; pointer-events: none;
  color: var(--ink);
}
.quad-icon { font-size: 28px; margin-bottom: 10px; }
.quad-label {
  font-family: 'Courier Prime', monospace;
  font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase;
  color: var(--muted); margin-bottom: 4px;
}
.quad-title { font-size: 13px; font-weight: 600; line-height: 1.3; }
.quad-panel.qp1 { background: var(--cream); }
.quad-panel.qp2 { background: var(--forest); }
.quad-panel.qp2 .quad-label, .quad-panel.qp2 .quad-title { color: rgba(245,240,232,0.85); }
.quad-panel.qp2 .quad-bg-num { color: var(--cream); opacity: 0.06; }
.quad-panel.qp3 { background: var(--orange); }
.quad-panel.qp3 .quad-label, .quad-panel.qp3 .quad-title { color: var(--cream); }
.quad-panel.qp3 .quad-bg-num { color: var(--cream); }
.quad-panel.qp4 { background: var(--cream2); }

/* ─── SECTION INTRO SLIDE ─── */
.s-section {
  flex-direction: row;
}
.sec-accent-bar {
  width: 6px; flex-shrink: 0;
  transition: background 0.6s ease;
}
.sec-left {
  width: 260px; flex-shrink: 0;
  display: flex; flex-direction: column; justify-content: center;
  padding: 48px 40px;
  border-right: 1px solid var(--rule);
}
.sec-num {
  font-family: 'Playfair Display', serif;
  font-size: 120px; font-weight: 900; line-height: 1;
  margin-bottom: 8px; letter-spacing: -0.04em;
}
.sec-of {
  font-family: 'Courier Prime', monospace;
  font-size: 9px; color: var(--muted); letter-spacing: 0.2em; text-transform: uppercase;
}
.sec-right {
  flex: 1; display: flex; flex-direction: column; justify-content: center;
  padding: 48px 60px;
}
.sec-title {
  font-family: 'Playfair Display', serif;
  font-size: clamp(30px, 3.5vw, 56px); font-weight: 700;
  line-height: 1.05; margin-bottom: 16px; letter-spacing: -0.01em;
}
.sec-desc {
  font-size: 14px; color: var(--muted); line-height: 1.75;
  max-width: 480px; margin-bottom: 36px;
}
.subtopic-rows { display: flex; flex-direction: column; gap: 10px; }
.str {
  display: flex; align-items: center; gap: 14px;
  padding: 13px 16px;
  background: var(--cream2); border: 1px solid var(--rule);
  border-radius: 4px;
  font-size: 13px; font-weight: 400; color: var(--ink2);
  transition: all 0.18s;
}
.str:hover { background: var(--cream3); transform: translateX(3px); }
.str-bullet { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }

/* ─── CONTENT SLIDE ─── */
.s-content {
  flex-direction: row;
}
.cs-sidebar {
  width: 280px; flex-shrink: 0;
  padding: 48px 40px;
  border-right: 1px solid var(--rule);
  display: flex; flex-direction: column; justify-content: center;
  position: relative; overflow: hidden;
}
.cs-sidebar-bg {
  position: absolute; bottom: -30px; right: -30px;
  font-family: 'Playfair Display', serif;
  font-size: 160px; font-weight: 900; line-height: 1;
  opacity: 0.04; pointer-events: none; color: var(--ink);
  letter-spacing: -0.05em;
}
.cs-tag {
  font-family: 'Courier Prime', monospace;
  font-size: 9px; letter-spacing: 0.25em; text-transform: uppercase;
  margin-bottom: 14px;
  display: flex; align-items: center; gap: 8px;
}
.cs-tag::before { content: ''; width: 20px; height: 1px; }
.cs-heading {
  font-family: 'Playfair Display', serif;
  font-size: clamp(22px, 2.5vw, 38px); font-weight: 700;
  line-height: 1.1; margin-bottom: 14px;
}
.cs-sub { font-size: 13px; color: var(--muted); line-height: 1.65; }
.cs-body {
  flex: 1; padding: 40px 52px;
  display: flex; flex-direction: column; justify-content: center;
  overflow-y: auto;
}

/* ─── CARDS ─── */
.card-grid { display: grid; gap: 14px; }
.card-grid.g2 { grid-template-columns: 1fr 1fr; }
.card-grid.g3 { grid-template-columns: 1fr 1fr 1fr; }
.card-grid.g1 { grid-template-columns: 1fr; }

.card {
  padding: 20px 22px;
  background: var(--cream2);
  border: 1px solid var(--rule);
  border-radius: 6px;
  position: relative; overflow: hidden;
  transition: transform 0.2s, border-color 0.2s;
}
.card:hover { transform: translateY(-2px); border-color: rgba(26,26,20,0.2); }
.card-stripe {
  position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
}
.card-ico { font-size: 20px; margin-bottom: 9px; }
.card-title { font-size: 13px; font-weight: 600; margin-bottom: 6px; }
.card-text { font-size: 12px; color: var(--muted); line-height: 1.6; }
.card-chip {
  display: inline-block; margin-top: 9px;
  font-family: 'Courier Prime', monospace;
  font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase;
  padding: 3px 8px; border-radius: 2px;
}

/* ─── STAT ROW ─── */
.stat-row { display: flex; gap: 14px; margin-bottom: 18px; }
.stat-box {
  flex: 1; padding: 18px 16px; text-align: center;
  background: var(--cream2); border: 1px solid var(--rule); border-radius: 6px;
}
.stat-val {
  font-family: 'Playfair Display', serif;
  font-size: 36px; font-weight: 900; line-height: 1;
  margin-bottom: 5px; letter-spacing: -0.02em;
}
.stat-lbl { font-size: 11px; color: var(--muted); line-height: 1.4; }

/* ─── LIST ITEMS ─── */
.list-items { display: flex; flex-direction: column; gap: 10px; }
.li {
  display: flex; align-items: flex-start; gap: 14px;
  padding: 15px 18px;
  background: var(--cream2); border: 1px solid var(--rule); border-radius: 4px;
  transition: background 0.18s;
}
.li:hover { background: var(--cream3); }
.li-icon {
  width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; margin-top: 1px;
}
.li-title { font-size: 13px; font-weight: 600; margin-bottom: 3px; }
.li-desc { font-size: 12px; color: var(--muted); line-height: 1.55; }

/* ─── PIPELINE / FLOW ─── */
.pipeline { display: flex; align-items: stretch; gap: 0; }
.pipe-step {
  flex: 1; padding: 20px 14px; text-align: center;
  background: var(--cream2); border: 1px solid var(--rule);
  position: relative;
}
.pipe-step:not(:first-child)::before {
  content: '→'; position: absolute;
  left: -14px; top: 50%; transform: translateY(-50%);
  font-size: 16px; color: var(--muted2); z-index: 2;
  background: var(--cream); padding: 0 2px;
}
.pipe-num {
  font-family: 'Playfair Display', serif;
  font-size: 32px; font-weight: 900; line-height: 1;
  margin-bottom: 4px;
}
.pipe-label { font-size: 11px; font-weight: 600; margin-bottom: 3px; }
.pipe-sub { font-size: 10px; color: var(--muted); line-height: 1.4; }

/* ─── TABLE ─── */
.data-table { width: 100%; border-collapse: collapse; }
.data-table th {
  font-family: 'Courier Prime', monospace;
  font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase;
  color: var(--muted); padding: 10px 14px; text-align: left;
  border-bottom: 2px solid var(--rule);
}
.data-table td {
  font-size: 12px; padding: 11px 14px;
  border-bottom: 1px solid var(--rule2); color: var(--ink2);
}
.data-table tr:last-child td { border-bottom: none; }
.data-table tr:hover td { background: var(--cream2); }
.tag {
  display: inline-block; padding: 2px 8px; border-radius: 20px;
  font-size: 9px; font-weight: 600; letter-spacing: 0.05em;
}

/* ─── SPLIT SLIDE (50/50 with dark panel) ─── */
.half-dark {
  width: 50%; background: var(--forest);
  padding: 48px 44px; display: flex; flex-direction: column; justify-content: center;
}
.half-light {
  flex: 1; padding: 48px 44px;
  display: flex; flex-direction: column; justify-content: center;
}
.hd-eyebrow {
  font-family: 'Courier Prime', monospace;
  font-size: 9px; letter-spacing: 0.25em; text-transform: uppercase;
  color: rgba(245,240,232,0.5); margin-bottom: 16px;
  display: flex; align-items: center; gap: 8px;
}
.hd-eyebrow::before { content: ''; width: 20px; height: 1px; background: rgba(245,240,232,0.3); display:block; }
.hd-title {
  font-family: 'Playfair Display', serif;
  font-size: clamp(26px, 2.8vw, 44px); font-weight: 700;
  color: var(--cream); line-height: 1.05; margin-bottom: 14px;
}
.hd-desc { font-size: 13px; color: rgba(245,240,232,0.65); line-height: 1.7; }
.hd-stats { display: flex; flex-direction: column; gap: 12px; margin-top: 28px; }
.hd-stat {
  display: flex; align-items: baseline; gap: 12px;
  padding-bottom: 12px; border-bottom: 1px solid rgba(245,240,232,0.1);
}
.hd-stat:last-child { border-bottom: none; padding-bottom: 0; }
.hd-stat-val {
  font-family: 'Playfair Display', serif;
  font-size: 30px; font-weight: 900; color: var(--gold2);
  line-height: 1; flex-shrink: 0; min-width: 60px;
}
.hd-stat-lbl { font-size: 12px; color: rgba(245,240,232,0.6); line-height: 1.4; }

/* color accent helpers */
.forest { color: var(--forest); }
.orange { color: var(--orange); }
.gold { color: var(--gold); }
.ink { color: var(--ink); }
.bg-forest { background: var(--forest); }
.bg-orange { background: var(--orange); }
.bg-gold { background: var(--gold); }
.bg-ink { background: var(--ink); }

/* chip colors */
.chip-forest { background: rgba(28,58,43,0.1); color: var(--forest); }
.chip-orange { background: rgba(212,84,26,0.1); color: var(--orange); }
.chip-gold { background: rgba(196,149,42,0.1); color: var(--gold); }
.chip-ink { background: rgba(26,26,20,0.08); color: var(--ink2); }

/* ─── FOOTER NAV ─── */
.footer {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 40px;
  border-top: 1px solid var(--rule);
  background: var(--cream);
}
.dot-track { display: flex; gap: 6px; align-items: center; }
.dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--rule); cursor: pointer;
  transition: all 0.25s;
}
.dot.on { background: var(--forest); width: 18px; border-radius: 3px; }
.nav-btns { display: flex; gap: 8px; }
.nbtn {
  padding: 9px 22px; border-radius: 3px;
  font-family: 'Outfit', sans-serif; font-size: 12px; font-weight: 500;
  cursor: pointer; transition: all 0.2s;
  border: 1px solid var(--rule);
  background: var(--cream2); color: var(--ink);
}
.nbtn:hover { background: var(--cream3); border-color: rgba(26,26,20,0.2); }
.nbtn.prim { background: var(--forest); color: var(--cream); border-color: var(--forest); }
.nbtn.prim:hover { background: var(--forest2); }
.nbtn:disabled { opacity: 0.3; cursor: not-allowed; }
.kbd-hint {
  font-family: 'Courier Prime', monospace;
  font-size: 10px; color: var(--muted);
}
.k { display: inline-block; padding: 1px 5px; border: 1px solid var(--muted); border-radius: 2px; }

/* ─── ANIMATIONS ─── */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(16px); }
  to   { opacity: 1; transform: translateY(0); }
}
.slide.active .card,
.slide.active .li,
.slide.active .stat-box,
.slide.active .pipe-step,
.slide.active .str,
.slide.active .hd-stat {
  animation: fadeUp 0.4s both;
}
.slide.active .card:nth-child(1),.slide.active .li:nth-child(1),.slide.active .stat-box:nth-child(1),.slide.active .pipe-step:nth-child(1),.slide.active .str:nth-child(1),.slide.active .hd-stat:nth-child(1){animation-delay:0.04s}
.slide.active .card:nth-child(2),.slide.active .li:nth-child(2),.slide.active .stat-box:nth-child(2),.slide.active .pipe-step:nth-child(2),.slide.active .str:nth-child(2),.slide.active .hd-stat:nth-child(2){animation-delay:0.09s}
.slide.active .card:nth-child(3),.slide.active .li:nth-child(3),.slide.active .stat-box:nth-child(3),.slide.active .pipe-step:nth-child(3),.slide.active .str:nth-child(3),.slide.active .hd-stat:nth-child(3){animation-delay:0.14s}
.slide.active .card:nth-child(4),.slide.active .li:nth-child(4),.slide.active .pipe-step:nth-child(4),.slide.active .str:nth-child(4),.slide.active .hd-stat:nth-child(4){animation-delay:0.19s}
.slide.active .card:nth-child(5),.slide.active .li:nth-child(5){animation-delay:0.24s}
</style>
</head>
<body>
<div class="bg-shape bg-circle-1"></div>
<div class="bg-shape bg-circle-2"></div>
<div class="bg-shape bg-stripe bg-stripe-1"></div>
<div class="bg-shape bg-stripe bg-stripe-2"></div>

<div id="app">
  <!-- HEADER -->
  <header class="header">
    <div class="header-brand">Scaling & Growth · Strategy Deck</div>
    <div class="header-nav" id="headerNav"></div>
    <div class="header-counter"><span id="hcCur">1</span> / <span id="hcTotal">14</span></div>
  </header>

  <!-- PROGRESS -->
  <div class="progress-track"><div class="progress-bar" id="progBar"></div></div>

  <!-- SLIDES -->
  <div class="slide-area" id="slideArea"></div>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="dot-track" id="dotTrack"></div>
    <div class="kbd-hint"><span class="k">←</span> <span class="k">→</span> navigate</div>
    <div class="nav-btns">
      <button class="nbtn" id="prevBtn" onclick="nav(-1)">← Previous</button>
      <button class="nbtn prim" id="nextBtn" onclick="nav(1)">Next →</button>
    </div>
  </footer>
</div>

<script>
const C = {

// ── STATE
let cur = 0, busy = false;
const total = slides.length;

const sections = [
  { id:0, lbl:'Overview' },
  { id:1, lbl:'01 Growth' },
  { id:2, lbl:'02 Marketing' },
  { id:3, lbl:'03 Operations' },
  { id:4, lbl:'04 Retention' },
];
const secStart = [0, 1, 5, 9, 12];

function boot() {
  const area = document.getElementById('slideArea');
  area.innerHTML = slides.map((s,i) => `
    <div class="slide ${i===0?'active':''}" id="sl${i}">${s.html}</div>
  `).join('');

  // dots
  const dt = document.getElementById('dotTrack');
  dt.innerHTML = slides.map((_,i) => `<div class="dot ${i===0?'on':''}" onclick="goTo(${i})"></div>`).join('');

  // header nav
  const hn = document.getElementById('headerNav');
  hn.innerHTML = sections.map((s,i) => `
    <button class="hnav-btn ${slides[0].sec===s.id?'active':''}" onclick="goTo(${secStart[i]})">${s.lbl}</button>
  `).join('');

  document.getElementById('hcTotal').textContent = total;
  update();
}

function update() {
  document.getElementById('progBar').style.width = (cur/(total-1)*100) + '%';
  document.getElementById('hcCur').textContent = cur + 1;
  document.querySelectorAll('.dot').forEach((d,i) => d.classList.toggle('on', i===cur));
  document.querySelectorAll('.hnav-btn').forEach((b,i) => b.classList.toggle('active', slides[cur].sec === sections[i].id));
  document.getElementById('prevBtn').disabled = cur === 0;
  document.getElementById('nextBtn').textContent = cur === total-1 ? '✓ Complete' : 'Next →';
  document.getElementById('nextBtn').disabled = false;
}

function goTo(n) {
  if (n===cur || busy || n<0 || n>=total) return;
  busy = true;
  const prev = document.getElementById('sl'+cur);
  const next = document.getElementById('sl'+n);
  prev.classList.add('exit-left'); prev.classList.remove('active');
  setTimeout(()=>{
    prev.classList.remove('exit-left');
    next.classList.add('active');
    cur = n; update(); busy = false;
  }, 360);
}

function nav(d) { goTo(cur + d); }

document.addEventListener('keydown', e => {
  if (e.key==='ArrowRight'||e.key==='ArrowDown') { e.preventDefault(); nav(1); }
  if (e.key==='ArrowLeft'||e.key==='ArrowUp')  { e.preventDefault(); nav(-1); }
});

boot();
</script>
